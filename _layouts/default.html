<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --link: #0969da; --code: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --link: #4493f8; --code: #161b22; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    header { border-bottom: 1px solid var(--border); padding: 12px 16px; }
    header a { color: var(--fg); font-weight: 600; text-decoration: none; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; overflow-wrap: anywhere; }
    a { color: var(--link); }
    img { max-width: 100%; height: auto; }
    pre, code { background: var(--code); border-radius: 6px; font-size: 0.9em; }
    pre { padding: 12px; overflow-x: auto; }
    code { padding: 0.1em 0.3em; }
    pre code { padding: 0; }
    table { border-collapse: collapse; display: block; overflow-x: auto; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: top; }
    blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">📚 {{ site.title }}</a></header>
  <main>{{ content }}</main>
</body>
</html>
