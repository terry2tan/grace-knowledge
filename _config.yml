title: Grace Knowledge
description: 个人知识库
lang: zh-CN

plugins:
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

defaults:
  # 文章正文里的 {{ }} 等按原样显示，不当模板解析
  - scope:
      path: ""
    values:
      render_with_liquid: false
  # INDEX.md 作为站点首页
  - scope:
      path: "INDEX.md"
    values:
      permalink: /

exclude:
  - logs/
  - .claude/
  - sync-to-github.sh
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
